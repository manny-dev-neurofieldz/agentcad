[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcad"
version = "0.1.0.dev0"
description = "Extensible agentic feedback loop for parametric 3D CAD design"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Craig Wm. Versek", email = "cversek@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
openscad = []  # OpenSCAD binary required externally
voxelcad = ["voxelcad[viz] @ git+https://github.com/cversek/voxelcad.git", "scipy", "psutil"]  # kernels need build_ext in that checkout; psutil is imported but undeclared upstream
build123d = ["build123d", "pyvista", "bd_warehouse"]
dev = ["pytest", "pytest-cov"]

[project.scripts]
agentcad = "agentcad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agentcad"]
omit = ["*/templates/*"]
# The build123d and VoxelCAD engines execute sources in worker subprocesses;
# without this patch their coverage would read as zero while the suite
# exercises them on every contract case.
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
