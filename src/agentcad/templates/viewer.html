<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${project_name} — AgentCAD</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
${threejs_scripts}
<style>
  :root { --bg: #1a1a2e; --card: #16213e; --accent: #0f3460; --text: #e0e0e0; --highlight: #e94560; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
  h1 { color: #fff; margin-bottom: 0.5rem; }
  h2 { color: var(--highlight); margin: 1rem 0 0.5rem; }
  .subtitle { color: #888; margin-bottom: 2rem; }
  .variant { background: var(--card); border-radius: 12px; padding: 1.5rem; margin-bottom: 2rem; }
  .gallery { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1rem 0; }
  .render-item { position: relative; }
  .render-item img { max-width: 280px; border-radius: 8px; border: 1px solid #333; }
  .view-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7);
    padding: 2px 8px; border-radius: 4px; font-size: 0.85rem; }
  table.params { border-collapse: collapse; margin: 0.5rem 0; }
  table.params th, table.params td { padding: 4px 12px; border: 1px solid #333; text-align: left; }
  table.params th { background: var(--accent); }
  table.meta { border-collapse: collapse; margin: 1rem 0; }
  table.meta td { padding: 4px 12px; border: 1px solid #333; }
  details { margin: 0.5rem 0; }
  summary { cursor: pointer; color: var(--highlight); font-weight: bold; }
  pre { margin: 0.5rem 0; border-radius: 8px; overflow-x: auto; }
  code { font-size: 0.9rem; }
  .stl-download, .stl-view { display: inline-block; padding: 6px 16px; border-radius: 6px;
    text-decoration: none; font-weight: bold; margin: 0.5rem 0.5rem 0.5rem 0; cursor: pointer;
    font-size: 0.9rem; border: none; }
  .stl-download { background: var(--accent); color: #fff; }
  .stl-download:hover { background: #1a4a80; }
  .stl-view { background: var(--highlight); color: #fff; }
  .stl-view:hover { background: #c73a50; }
  #viewer-container { display: none; width: 100%; height: 500px; background: #111;
    border-radius: 12px; margin: 1rem 0; position: relative; }
  #viewer-container.active { display: block; }
  #viewer-bar { position: absolute; top: 8px; left: 12px; right: 56px; z-index: 9; display: flex;
    flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.8rem; color: #bbb; }
  #viewer-bar button { background: rgba(255,255,255,0.12); color: #eee; border: 1px solid #444;
    border-radius: 4px; padding: 2px 8px; cursor: pointer; font-size: 0.8rem; }
  #viewer-bar button:hover { background: rgba(255,255,255,0.25); }
  #viewer-bar .hint { margin-left: auto; color: #777; }
  #mesh-tree { position: absolute; top: 44px; left: 12px; z-index: 9; background: rgba(0,0,0,0.6);
    border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; max-height: 60%; overflow: auto; display: none; }
  #mesh-tree.active { display: block; }
  #mesh-tree label { display: block; cursor: pointer; white-space: nowrap; }
  #mesh-tree .tree-actions { margin-bottom: 4px; }
  #mesh-tree .tree-actions button { background: none; border: none; color: var(--highlight); cursor: pointer;
    font-size: 0.8rem; padding: 0 4px; }
  .mesh-badge { display: inline-block; color: #f0c674; font-size: 0.85rem; margin: 0.5rem 0.5rem 0.5rem 0; }
  #viewer-close { position: absolute; top: 10px; right: 14px; background: var(--highlight);
    color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer;
    font-size: 1.2rem; z-index: 10; }
  .version-bar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem;
    padding: 0.75rem 1rem; background: var(--card); border-radius: 8px; }
  .version-bar label { font-weight: bold; color: var(--highlight); }
  .version-bar select { background: var(--accent); color: var(--text); border: 1px solid #444;
    border-radius: 6px; padding: 6px 12px; font-size: 0.95rem; cursor: pointer; }
  .variant { display: none; }
  .variant.active { display: block; }
  .tab-bar { display: flex; gap: 2px; margin: 0.75rem 0 0; border-bottom: 2px solid #333; }
  .tab { background: transparent; color: #888; border: none; padding: 8px 16px;
    cursor: pointer; font-size: 0.9rem; font-weight: bold; border-radius: 6px 6px 0 0;
    transition: all 0.15s; }
  .tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
  .tab.active { color: var(--highlight); border-bottom: 2px solid var(--highlight);
    margin-bottom: -2px; }
  .tab-content { display: none; padding: 1rem 0; }
  .tab-content.active { display: block; }
  .print-table { border-collapse: collapse; margin: 0.5rem 0; width: 100%; max-width: 500px; }
  .print-table th, .print-table td { padding: 6px 14px; border: 1px solid #333; text-align: left; }
  .print-table th { background: var(--accent); width: 40%; }
  .print-table .critical { color: #ff6b6b; font-weight: bold; }
  .notes { background: #0d1b2a; border-radius: 8px; padding: 1rem; margin: 0.5rem 0;
    font-family: system-ui; line-height: 1.6; }
  .notes p { margin: 0.3rem 0; }
  .notes strong { color: var(--highlight); }
  .timestamp { color: #666; font-size: 0.85rem; margin-left: 0.5rem; }
</style>
</head>
<body>
<h1>${project_name}</h1>
<p class="subtitle">Generated by AgentCAD</p>

<details>
<summary>Project Metadata</summary>
<table class="meta"><tbody>${metadata_rows}</tbody></table>
</details>

<div class="version-bar">
  <label for="version-select">Version:</label>
  <select id="version-select" onchange="selectVersion(this.value)"></select>
</div>

<div id="viewer-container">
  <button id="viewer-close" onclick="closeViewer()">&#215;</button>
  <div id="viewer-bar">
    <span class="view-btns">${view_buttons}</span>
    <button id="spin-btn" onclick="cycleSpin()">spin: off</button>
    <span class="hint">drag: orbit &middot; wheel: up/down &middot; shift+wheel: left/right &middot; ctrl+wheel: zoom &middot; right-drag: pan</span>
  </div>
  <div id="mesh-tree"></div>
  <canvas id="viewer-canvas"></canvas>
</div>

${variants_html}

<script>

let scene, camera, renderer, controls, holder, spinState = 0;
const container = document.getElementById('viewer-container');
const canvas = document.getElementById('viewer-canvas');
const tree = document.getElementById('mesh-tree');
// Engine-neutral camera presets (eye and up in CAD coordinates, Z up).
const PRESETS = ${camera_presets_json};
const SPIN = [{label: 'spin: off', on: false, sign: 1}, {label: 'spin: CW', on: true, sign: 1}, {label: 'spin: CCW', on: true, sign: -1}];
// The holder stands CAD Z-up meshes upright in the Y-up scene: CAD (x, y, z) -> scene (x, z, -y).
const toScene = v => new THREE.Vector3(v[0], v[2], -v[1]);
let sceneCenter = new THREE.Vector3(), sceneSize = 1;

function initViewer() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);
  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 5000);
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.enableZoom = false;   // the wheel pans; ctrl/cmd + wheel zooms
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const dolly = e.ctrlKey || e.metaKey;
    if (dolly) {
      const f = Math.exp((e.deltaY > 0 ? 1 : -1) * 0.1);
      camera.position.sub(controls.target).multiplyScalar(f).add(controls.target);
      return;
    }
    const horizontal = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
    const amount = (horizontal ? (e.deltaX || e.deltaY) : e.deltaY) * 0.0015 * camera.position.distanceTo(controls.target);
    const right = new THREE.Vector3(), up = new THREE.Vector3();
    camera.matrixWorld.extractBasis(right, up, new THREE.Vector3());
    const shift = horizontal ? right.multiplyScalar(-amount) : up.multiplyScalar(amount);
    camera.position.add(shift); controls.target.add(shift);
  }, { passive: false });
  scene.add(new THREE.AmbientLight(0x404040, 2));
  const dir1 = new THREE.DirectionalLight(0xffffff, 1.5); dir1.position.set(1, 1, 1); scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0x8888ff, 0.8); dir2.position.set(-1, -0.5, -1); scene.add(dir2);
  (function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();
}

function resetScene() {
  container.classList.add('active');
  if (!renderer) initViewer();
  if (holder) scene.remove(holder);
  holder = new THREE.Group();
  holder.rotation.x = -Math.PI / 2;
  scene.add(holder);
  tree.innerHTML = '';
  tree.classList.remove('active');
}

const PALETTE = [0x4488cc, 0xcc8844, 0x44aa77, 0xaa4477, 0x8877cc, 0xcccc44, 0x44bbcc, 0xcc4444];
function addMesh(geometry, name, index) {
  geometry.computeVertexNormals();
  const mesh = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({ color: PALETTE[index % PALETTE.length], specular: 0x222222, shininess: 40 }));
  mesh.name = name;
  holder.add(mesh);
  return mesh;
}

function frameAll() {
  const box = new THREE.Box3().setFromObject(holder);
  if (box.isEmpty()) return;
  box.getCenter(sceneCenter);
  holder.position.sub(sceneCenter); sceneCenter.set(0, 0, 0);
  sceneSize = box.getSize(new THREE.Vector3()).length();
  setView('iso');
}

window.setView = function(name) {
  const p = PRESETS[name]; if (!p || !camera) return;
  const eye = toScene(p.eye).normalize().multiplyScalar(sceneSize * 1.3);
  camera.up.copy(toScene(p.up).normalize());
  camera.position.copy(sceneCenter).add(eye);
  controls.target.copy(sceneCenter);
  controls.update();
};

window.cycleSpin = function() {
  spinState = (spinState + 1) % SPIN.length;
  const st = SPIN[spinState];
  if (controls) { controls.autoRotate = st.on; controls.autoRotateSpeed = 1.2 * st.sign; }
  document.getElementById('spin-btn').textContent = st.label;
};

function buildTree() {
  const meshes = holder.children;
  if (meshes.length < 2) return;
  tree.classList.add('active');
  const actions = document.createElement('div'); actions.className = 'tree-actions';
  const all = document.createElement('button'); all.textContent = 'show all';
  all.onclick = () => { meshes.forEach(m => m.visible = true); tree.querySelectorAll('input').forEach(i => i.checked = true); };
  actions.appendChild(all);
  tree.appendChild(actions);
  meshes.forEach(m => {
    const label = document.createElement('label');
    const box = document.createElement('input'); box.type = 'checkbox'; box.checked = true;
    box.onchange = () => { m.visible = box.checked; };
    const only = document.createElement('button'); only.textContent = 'only';
    only.onclick = e => { e.preventDefault(); meshes.forEach(o => o.visible = (o === m)); tree.querySelectorAll('input').forEach((i, k) => i.checked = (meshes[k] === m)); };
    label.appendChild(box); label.append(' ' + m.name + ' '); label.appendChild(only);
    tree.appendChild(label);
  });
}

// Meshes of one variant: inline base64 blocks (under the embed cap) or files beside the page.
window.loadVariantMeshes = function(vid) {
  resetScene();
  const blocks = document.querySelectorAll('script.mesh-data[data-variant="' + vid + '"]');
  const loader = new THREE.STLLoader();
  let pending = 0, index = 0;
  blocks.forEach(el => {
    const name = el.dataset.name || ('mesh ' + (index + 1));
    if (el.dataset.src) {
      pending++;
      const i = index++;
      loader.load(el.dataset.src, g => { addMesh(g, name, i); if (--pending === 0) { frameAll(); buildTree(); } });
    } else {
      const bin = Uint8Array.from(atob(el.textContent), c => c.charCodeAt(0));
      addMesh(loader.parse(bin.buffer), name, index++);
    }
  });
  if (pending === 0) { frameAll(); buildTree(); }
};
window.loadSTLData = function(id) {   // single-mesh pages generated before the mesh list
  const el = document.getElementById('stl-data-' + id); if (!el) return;
  resetScene();
  const bin = Uint8Array.from(atob(el.textContent), c => c.charCodeAt(0));
  addMesh(new THREE.STLLoader().parse(bin.buffer), id, 0); frameAll();
};
window.loadSTL = function(path) { resetScene(); new THREE.STLLoader().load(path, g => { addMesh(g, path, 0); frameAll(); }); };

window.closeViewer = function() { container.classList.remove('active'); };

// Tab switching within a variant
window.switchTab = function(btn, tabName) {
  const variant = btn.closest('.variant');
  variant.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  variant.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  variant.querySelector('[data-tab="' + tabName + '"]').classList.add('active');
};

// Version selector
window.selectVersion = function(idx) {
  document.querySelectorAll('.variant').forEach((el, i) => {
    el.classList.toggle('active', i === parseInt(idx));
  });
  closeViewer();
};

// Initialize: populate selector, show first (latest)
document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('version-select');
  const variants = document.querySelectorAll('.variant');
  variants.forEach((el, i) => {
    const name = el.querySelector('h2')?.textContent || ('v' + (i + 1));
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = name;
    sel.appendChild(opt);
  });
  if (variants.length > 0) {
    sel.value = '0';
    selectVersion('0');
  }

  // Render markdown in notes blocks
  document.querySelectorAll('.notes-raw').forEach(el => {
    const md = el.textContent;
    // Simple markdown: **bold**, *italic*, `code`, newlines
    let html = md
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$$1</strong>')
      .replace(/\*(.+?)\*/g, '<em>$$1</em>')
      .replace(/`(.+?)`/g, '<code>$$1</code>')
      .replace(/\n/g, '<br>');
    el.innerHTML = html;
    el.classList.remove('notes-raw');
    el.classList.add('notes');
  });
});
</script>
<script>hljs.highlightAll();</script>
</body>
</html>
