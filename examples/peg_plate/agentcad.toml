[project]
name = "peg_plate"
engine = "build123d"
description = "A plate with a row of holes and the peg that presses into them: a two-part assembly the viewer shows with toggles"
parts = ["parts/*"]
[engine.build123d]
expected_solids = 4
[output]
base_dir = ".."
sub_dir = "."
image_size = 512
default_views = ["iso", "front", "top", "right"]

# Mates: the middle peg in the middle hole. hole_d 5.0 minus clearance 0.1 = peg 4.9,
# so the nominal gap is 0.05 per side; the window boxes the hole through the plate, in
# the frame of the first part. Each part declares its own side's datums in its own
# agentcad.toml, so finalize poses the peg in the hole from them.
[mates.middle_peg]
parts = ["plate", "peg"]
window = [-3.0, -3.0, -3.5, 3.0, 3.0, 3.5]
nominal_mm = 0.05
